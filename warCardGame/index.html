<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>newCardGame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.3.3/dist/semantic.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" media="screen" href="main.css">
</head>

<body>
  <div class="pageContainer">
    <div class="container mt-3">
      <div class="table">
        <div class="row mt-3 d-flex justify-content-evenly align-items-center">
          <button type="button" class="btn btn-primary col-2">Deal</button>
          <div class="screenText d-flex justify-content-evenly align-items-center">This is WAR!!! === Click Deal to
            Start
          </div>
        </div>

        <div class="d-flex justify-content-evenly align-items-center mt-3">
          User Cards Left: <div class="userCardsLeft counterStyle d-flex justify-content-evenly align-items-center">
          </div>
          Computer Cards Left: <div
            class="computerCardsLeft counterStyle d-flex justify-content-evenly align-items-center"></div>
        </div>
        <div class="row mt-3">
          <div class="d-flex justify-content-between align-items-center">
            <div class="user cardContainerStyles">
            </div>
            <div class="winnerText"></div>
            <div class="computer cardContainerStyles">
            </div>
          </div>
        </div>
      </div>
      <!--end of bs container-->
    </div>
    <!--end of pageContainer-->
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.2.6/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>

</html>
